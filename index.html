<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>나의 영어 학습</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --text:#e2e8f0; --muted:#94a3b8;
    --brand:#6366f1; --brand2:#818cf8; --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    --border:#334155; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --text:#0f172a; --muted:#64748b;
      --brand:#4f46e5; --brand2:#6366f1; --border:#e2e8f0; --shadow:0 10px 30px rgba(15,23,42,.08);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  .app{width:100%; max-width:560px; padding:16px 16px 96px; flex:1}
  header{display:flex; align-items:center; justify-content:space-between; margin:8px 2px 18px}
  header h1{font-size:20px; margin:0; display:flex; align-items:center; gap:8px}
  header .streak{font-size:13px; color:var(--muted); background:var(--panel); border:1px solid var(--border);
    padding:6px 10px; border-radius:999px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow);
    padding:22px; margin-bottom:16px}
  h2{font-size:16px; margin:0 0 14px}
  .muted{color:var(--muted)}
  .row{display:flex; gap:10px}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .stat{background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center}
  .stat b{display:block; font-size:24px}
  .stat span{font-size:12px; color:var(--muted)}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:14px; font-size:15px; font-weight:600;
    padding:14px 16px; transition:transform .06s ease, opacity .2s; color:#fff; background:var(--brand)}
  button:active{transform:scale(.97)}
  button.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border)}
  button.wide{width:100%}
  button.sm{padding:10px 14px; font-size:14px}
  button:disabled{opacity:.45; cursor:default}
  .icon-btn{background:transparent; color:var(--muted); padding:8px; font-size:20px}
  .mode-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:18px 8px;
    background:var(--panel2); color:var(--text); border:1px solid var(--border)}
  .mode-btn .em{font-size:28px}
  .mode-btn small{font-size:11px; color:var(--muted); font-weight:400}

  /* Flashcard */
  .flash{perspective:1200px; margin-bottom:16px}
  .flash-inner{position:relative; width:100%; min-height:230px; transition:transform .5s; transform-style:preserve-3d}
  .flash.flip .flash-inner{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:24px; border-radius:20px;
    background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); text-align:center}
  .face.back{transform:rotateY(180deg); background:linear-gradient(160deg,var(--brand),var(--brand2)); color:#fff; border:none}
  .word{font-size:32px; font-weight:800; letter-spacing:.3px; word-break:break-word}
  .phon{font-size:15px; color:var(--muted)}
  .pos{font-size:12px; text-transform:uppercase; letter-spacing:1px; opacity:.8}
  .mean{font-size:25px; font-weight:700}
  .ex{font-size:14px; opacity:.92; line-height:1.5}
  .tap-hint{position:absolute; bottom:12px; font-size:12px; color:var(--muted)}
  .speak{position:absolute; top:12px; right:12px; background:rgba(255,255,255,.15); border-radius:999px;
    width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; font-size:18px}
  .face .speak{color:var(--brand)}
  .face.back .speak{color:#fff}

  .progress-line{height:8px; background:var(--panel2); border-radius:999px; overflow:hidden; margin:2px 0 14px; border:1px solid var(--border)}
  .progress-line>i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); width:0}

  /* Quiz */
  .opt{width:100%; text-align:left; background:var(--panel2); color:var(--text); border:2px solid var(--border);
    margin-bottom:10px; font-weight:600}
  .opt.correct{border-color:var(--good); background:color-mix(in srgb,var(--good) 15%,var(--panel2))}
  .opt.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 15%,var(--panel2))}
  .opt:disabled{opacity:1}
  .big-speaker{font-size:64px; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    width:110px; height:110px; border-radius:50%; margin:6px auto 18px; display:flex; align-items:center; justify-content:center}
  .spell-feedback{min-height:24px; font-weight:700; margin:10px 0}
  .spell-feedback.ok{color:var(--good)} .spell-feedback.no{color:var(--bad)}

  /* Nav */
  .nav{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; background:var(--panel);
    border-top:1px solid var(--border); padding:6px 0 env(safe-area-inset-bottom); z-index:40}
  .nav .inner{display:flex; width:100%; max-width:560px}
  .nav button{flex:1; background:transparent; color:var(--muted); border-radius:0; font-size:11px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0}
  .nav button .em{font-size:22px}
  .nav button.active{color:var(--brand)}
  .hidden{display:none!important}
  .center{text-align:center}
  .big-emoji{font-size:56px; margin-bottom:8px}
  select,input{font-family:inherit; font-size:15px; padding:12px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); width:100%}
  label{font-size:13px; color:var(--muted); display:block; margin:12px 0 6px}
  .word-item{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border); gap:8px}
  .word-item:last-child{border-bottom:none}
  .word-item .en{font-weight:700}
  .word-item .ko{font-size:13px; color:var(--muted)}
  .badge{font-size:11px; padding:3px 8px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); white-space:nowrap}
  .badge.mastered{color:var(--good); border-color:var(--good)}
  .badge.wrongb{color:var(--bad); border-color:var(--bad)}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📚 나의 영어</h1>
    <div class="streak" id="streakBadge">🔥 0일</div>
  </header>

  <!-- ================= HOME ================= -->
  <section id="view-home">
    <div class="card">
      <h2>오늘의 학습</h2>
      <div class="progress-line"><i id="dailyBar"></i></div>
      <div class="muted" id="dailyText" style="font-size:13px;margin-bottom:16px">오늘 0/10 단어 학습</div>
      <div class="grid">
        <div class="stat"><b id="statLearned">0</b><span>배운 단어</span></div>
        <div class="stat"><b id="statMastered">0</b><span>마스터</span></div>
        <div class="stat"><b id="statStreak">0</b><span>연속일</span></div>
      </div>
    </div>

    <div class="card">
      <h2>학습 세트</h2>
      <label for="deckSel">난이도 / 주제 선택</label>
      <select id="deckSel"></select>
      <div class="muted" id="deckDesc" style="font-size:13px;margin:10px 2px 16px"></div>
      <button class="wide" onclick="startStudy()">▶ 학습 시작</button>
    </div>

    <div class="card">
      <h2>📕 오답 노트</h2>
      <div class="muted" id="wrongInfo" style="font-size:13px;margin-bottom:14px">아직 틀린 단어가 없어요.</div>
      <button class="ghost wide" id="wrongBtn" onclick="startQuiz('wrong')">📕 틀린 단어 복습하기</button>
    </div>

    <div class="card">
      <h2>💾 데이터</h2>
      <div class="muted" style="font-size:13px;margin-bottom:14px">학습 기록과 내 단어장을 파일로 저장하거나 다른 기기로 옮길 수 있어요.</div>
      <div class="row">
        <button class="ghost wide sm" onclick="exportData()">⬇️ 백업 저장</button>
        <button class="ghost wide sm" onclick="document.getElementById('importFile').click()">⬆️ 백업 불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden" onchange="importData(this)">
    </div>
  </section>

  <!-- ================= STUDY ================= -->
  <section id="view-study" class="hidden">
    <div id="studyMain">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="icon-btn" onclick="go('home')">✕</button>
        <div class="muted" id="studyCount" style="font-size:13px"></div>
        <button class="icon-btn" onclick="shuffleStudy()">🔀</button>
      </div>
      <div class="progress-line"><i id="studyBar"></i></div>

      <div class="flash" id="flash" onclick="flipCard()">
        <div class="flash-inner">
          <div class="face front">
            <button class="speak" onclick="event.stopPropagation();speakCurrent()">🔊</button>
            <div class="pos" id="fPos"></div>
            <div class="word" id="fWord"></div>
            <div class="phon" id="fPhon"></div>
            <div class="tap-hint">탭하면 뜻 보기</div>
          </div>
          <div class="face back">
            <button class="speak" onclick="event.stopPropagation();speakCurrent()">🔊</button>
            <div class="mean" id="fMean"></div>
            <div class="ex" id="fEx"></div>
            <div class="tap-hint">탭하면 단어 보기</div>
          </div>
        </div>
      </div>

      <div class="row">
        <button class="ghost wide" onclick="rate(false)">😵 아직 몰라요</button>
        <button class="wide" style="background:var(--good)" onclick="rate(true)">😎 알아요</button>
      </div>
    </div>

    <div id="studyDone" class="card center hidden" style="margin-top:40px">
      <div class="big-emoji">🎊</div>
      <h2>학습 완료!</h2>
      <div class="muted" id="sdDeck" style="margin-bottom:6px"></div>
      <div style="font-size:36px;font-weight:800;margin:8px 0" id="sdScore"></div>
      <div class="muted" style="margin-bottom:20px">단어를 마스터했어요 ⭐</div>
      <button class="wide" onclick="startStudy()">🔁 다시 학습</button>
      <button class="ghost wide" style="margin-top:10px" onclick="go('home')">🏠 홈으로</button>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="view-quiz" class="hidden">
    <!-- 모드 선택 -->
    <div id="quizMenu">
      <div class="card">
        <h2>✍️ 퀴즈 모드 선택</h2>
        <label for="quizDeckSel">학습 세트</label>
        <select id="quizDeckSel" style="margin-bottom:14px"></select>
        <div class="grid2">
          <button class="mode-btn" onclick="startQuiz('meaning')"><span class="em">📖</span>뜻 맞히기<small>단어 보고 뜻 고르기</small></button>
          <button class="mode-btn" onclick="startQuiz('listening')"><span class="em">🎧</span>듣기<small>발음 듣고 뜻 고르기</small></button>
          <button class="mode-btn" onclick="startQuiz('spelling')"><span class="em">⌨️</span>스펠링<small>뜻 보고 영어 쓰기</small></button>
          <button class="mode-btn" onclick="startQuiz('wrong')"><span class="em">📕</span>오답 복습<small>틀린 단어만 다시</small></button>
        </div>
      </div>
    </div>

    <!-- 진행 -->
    <div id="quizPlay" class="hidden">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="icon-btn" onclick="showQuizMenu()">✕</button>
        <div class="muted" id="quizProg" style="font-size:13px"></div>
        <div style="width:36px"></div>
      </div>
      <div class="progress-line"><i id="quizBar"></i></div>

      <div class="card center" id="quizCard">
        <div class="muted pos" id="quizPrompt"></div>
        <div class="word hidden" id="quizWord" style="margin:8px 0 20px"></div>
        <button class="big-speaker hidden" id="quizSpeaker" onclick="speak(currentQuizWord().en)">🔊</button>
        <div id="quizOpts"></div>
        <div id="quizSpell" class="hidden">
          <input id="spellInput" placeholder="영어로 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false"
            style="text-align:center;font-size:20px;font-weight:700" onkeydown="if(event.key==='Enter')checkSpell()">
          <div class="spell-feedback" id="spellFb"></div>
          <button class="wide" id="spellBtn" onclick="checkSpell()">확인</button>
          <button class="ghost wide sm" style="margin-top:8px" onclick="giveUpSpell()">🤷 모르겠어요</button>
        </div>
      </div>
    </div>

    <!-- 결과 -->
    <div class="card center hidden" id="quizResult">
      <div class="big-emoji" id="qrEmoji">🎉</div>
      <h2 id="qrTitle">퀴즈 완료!</h2>
      <div style="font-size:40px;font-weight:800;margin:6px 0" id="qrScore">0/0</div>
      <div class="muted" id="qrMsg" style="margin-bottom:18px"></div>
      <button class="wide" onclick="startQuiz(quizMode)">🔁 다시 풀기</button>
      <button class="ghost wide" style="margin-top:10px" onclick="showQuizMenu()">모드 선택으로</button>
    </div>
  </section>

  <!-- ================= LIST ================= -->
  <section id="view-list" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">단어 목록</h2>
        <select id="listDeckSel" style="width:auto" onchange="renderList()"></select>
      </div>
      <input id="listSearch" placeholder="🔍 단어/뜻 검색" style="margin:8px 0 4px" oninput="renderList()">
      <div id="listBody"></div>
    </div>
  </section>

  <!-- ================= MY WORDS ================= -->
  <section id="view-mywords" class="hidden">
    <div class="card">
      <h2 id="myFormTitle">⭐ 단어 추가</h2>
      <label>영어 단어 *</label>
      <input id="mwEn" placeholder="예: serendipity" autocapitalize="off">
      <label>뜻 (한국어) *</label>
      <input id="mwKo" placeholder="예: 뜻밖의 행운">
      <label>발음 기호 (선택)</label>
      <input id="mwPhon" placeholder="예: /ˌserənˈdɪpəti/" autocapitalize="off">
      <label>예문 (선택)</label>
      <input id="mwEx" placeholder="예: It was pure serendipity." autocapitalize="off">
      <label>예문 뜻 (선택)</label>
      <input id="mwExKo" placeholder="예: 그건 순전히 뜻밖의 행운이었다.">
      <div class="row" style="margin-top:16px">
        <button class="wide" id="mwSaveBtn" onclick="saveMyWord()">💾 저장</button>
        <button class="ghost wide hidden" id="mwCancelBtn" onclick="resetMyForm()">취소</button>
      </div>
    </div>

    <div class="card">
      <h2>내 단어장 <span class="muted" id="myCount" style="font-weight:400;font-size:13px"></span></h2>
      <div class="muted hidden" id="myEmpty" style="font-size:13px">아직 저장한 단어가 없어요. 위에서 추가해 보세요!</div>
      <div id="myBody"></div>
    </div>
  </section>
</div>

<!-- ================= NAV ================= -->
<nav class="nav">
  <div class="inner">
    <button data-nav="home" class="active" onclick="go('home')"><span class="em">🏠</span>홈</button>
    <button data-nav="study" onclick="startStudy()"><span class="em">📇</span>학습</button>
    <button data-nav="quiz" onclick="go('quiz')"><span class="em">✍️</span>퀴즈</button>
    <button data-nav="list" onclick="go('list')"><span class="em">📋</span>목록</button>
    <button data-nav="mywords" onclick="go('mywords')"><span class="em">⭐</span>내 단어</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   데이터: 기본 제공 학습 세트
   각 단어: en(단어), phon(발음), pos(품사), ko(뜻), ex(예문), exKo(예문 뜻)
   ===================================================================== */
const BUILTIN_DECKS = [
  {
    id:"basic", name:"🌱 기초 필수 단어", desc:"일상에서 가장 자주 쓰는 기본 단어들이에요.",
    words:[
      {en:"apple", phon:"/ˈæpl/", pos:"noun", ko:"사과", ex:"I eat an apple every morning.", exKo:"나는 매일 아침 사과를 먹는다."},
      {en:"water", phon:"/ˈwɔːtər/", pos:"noun", ko:"물", ex:"Please give me a glass of water.", exKo:"물 한 잔 주세요."},
      {en:"friend", phon:"/frend/", pos:"noun", ko:"친구", ex:"She is my best friend.", exKo:"그녀는 내 가장 친한 친구다."},
      {en:"happy", phon:"/ˈhæpi/", pos:"adjective", ko:"행복한", ex:"I feel happy today.", exKo:"나는 오늘 행복하다."},
      {en:"eat", phon:"/iːt/", pos:"verb", ko:"먹다", ex:"Let's eat lunch together.", exKo:"같이 점심 먹자."},
      {en:"house", phon:"/haʊs/", pos:"noun", ko:"집", ex:"They live in a big house.", exKo:"그들은 큰 집에 산다."},
      {en:"book", phon:"/bʊk/", pos:"noun", ko:"책", ex:"I read a book before bed.", exKo:"나는 자기 전에 책을 읽는다."},
      {en:"run", phon:"/rʌn/", pos:"verb", ko:"달리다", ex:"I run in the park every day.", exKo:"나는 매일 공원에서 달린다."},
      {en:"beautiful", phon:"/ˈbjuːtɪfl/", pos:"adjective", ko:"아름다운", ex:"What a beautiful sunset!", exKo:"정말 아름다운 노을이야!"},
      {en:"time", phon:"/taɪm/", pos:"noun", ko:"시간", ex:"What time is it now?", exKo:"지금 몇 시야?"},
      {en:"love", phon:"/lʌv/", pos:"verb", ko:"사랑하다", ex:"I love my family.", exKo:"나는 내 가족을 사랑한다."},
      {en:"study", phon:"/ˈstʌdi/", pos:"verb", ko:"공부하다", ex:"I study English every night.", exKo:"나는 매일 밤 영어를 공부한다."}
    ]
  },
  {
    id:"daily", name:"🗣️ 일상 회화", desc:"실제 대화에서 바로 쓸 수 있는 표현 중심 단어예요.",
    words:[
      {en:"appointment", phon:"/əˈpɔɪntmənt/", pos:"noun", ko:"약속, 예약", ex:"I have a doctor's appointment at 3.", exKo:"나는 3시에 병원 예약이 있다."},
      {en:"available", phon:"/əˈveɪləbl/", pos:"adjective", ko:"시간이 되는, 이용 가능한", ex:"Are you available tomorrow?", exKo:"내일 시간 돼?"},
      {en:"recommend", phon:"/ˌrekəˈmend/", pos:"verb", ko:"추천하다", ex:"Can you recommend a good restaurant?", exKo:"좋은 식당 추천해 줄래?"},
      {en:"actually", phon:"/ˈæktʃuəli/", pos:"adverb", ko:"사실은", ex:"Actually, I changed my mind.", exKo:"사실, 나 마음이 바뀌었어."},
      {en:"complain", phon:"/kəmˈpleɪn/", pos:"verb", ko:"불평하다", ex:"He always complains about work.", exKo:"그는 항상 일에 대해 불평한다."},

const CUSTOM_ID = "custom";

/* =====================================================================
   상태 관리 (localStorage 영구 저장)
   ===================================================================== */
const STORE_KEY = "myEnglishApp_v1";
const DAILY_GOAL = 10;
let state = load();

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  s = s || {};
  // v1 -> v2 마이그레이션: 없는 필드는 기본값 채움
  return {
    progress: s.progress || {},          // deckId::en -> {box:1..5, seen, correct}
    lastStudyDate: s.lastStudyDate || null,
    streak: s.streak || 0,
    todayCount: s.todayCount || 0,
    todayDate: s.todayDate || null,
    selectedDeck: s.selectedDeck || BUILTIN_DECKS[0].id,
    customWords: s.customWords || [],    // {en, ko, phon, pos, ex, exKo}
    wrongSet: s.wrongSet || {}           // deckId::en -> true (오답 노트)
  };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function getDecks(){
  const decks = [...BUILTIN_DECKS];
  if(state.customWords.length > 0){
    decks.push({id:CUSTOM_ID, name:"⭐ 내 단어장", desc:"내가 직접 저장한 단어들이에요.", words:state.customWords});
  }
  return decks;
}
function findDeck(id){ return getDecks().find(d=>d.id===id); }
function allWords(){ return getDecks().flatMap(d=>d.words); }

function wordKey(deckId, en){ return deckId+"::"+en; }
function getWordProg(deckId, en){
  const k = wordKey(deckId, en);
  if(!state.progress[k]) state.progress[k] = {box:1, seen:0, correct:0};
  return state.progress[k];
}
function wrongCount(){ return Object.keys(state.wrongSet).length; }
function wrongWords(){
  // 오답 키를 실제 단어 객체로 변환 (삭제된 단어는 건너뜀)
  const out = [];
  for(const k of Object.keys(state.wrongSet)){
    const [deckId, en] = k.split("::");
    const d = findDeck(deckId);
    const w = d && d.words.find(x=>x.en===en);
    if(w) out.push({...w, _deckId:deckId});
    else delete state.wrongSet[k]; // 정리
  }
  return out;
}
function markResult(deckId, en, correct){
  const p = getWordProg(deckId, en);
  p.seen++;
  if(correct){
    p.correct++; p.box = Math.min(5, p.box+1);
    delete state.wrongSet[wordKey(deckId,en)];   // 맞히면 오답 노트에서 제거
  }else{
    p.box = Math.max(1, p.box-1);
    state.wrongSet[wordKey(deckId,en)] = true;   // 틀리면 오답 노트에 추가
  }
  state.todayCount++;
  registerStudyDay();
  save();
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function checkStreak(){
  const t = todayStr();
  if(state.todayDate !== t){ state.todayCount = 0; state.todayDate = t; save(); }
}
function registerStudyDay(){
  const t = todayStr();
  if(state.lastStudyDate === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  state.streak = (state.lastStudyDate === yStr) ? state.streak+1 : 1;
  state.lastStudyDate = t;
}

/* =====================================================================
   화면 전환
   ===================================================================== */
function go(view){
  checkStreak();
  speechSynthesis.cancel && speechSynthesis.cancel();
  document.querySelectorAll('section[id^="view-"]').forEach(s=>s.classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  document.querySelectorAll('.nav button[data-nav]').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav===view);
  });
  if(view==='home') renderHome();
  if(view==='quiz') showQuizMenu();
  if(view==='list') renderList();
  if(view==='mywords') renderMyWords();
  window.scrollTo(0,0);
}

/* =====================================================================
   홈
   ===================================================================== */
function renderHome(){
  checkStreak();
  const learned = Object.values(state.progress).filter(p=>p.seen>0).length;
  const mastered = Object.values(state.progress).filter(p=>p.box>=5).length;
  document.getElementById('statLearned').textContent = learned;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('streakBadge').textContent = "🔥 "+state.streak+"일";

  const pct = Math.min(100, Math.round(state.todayCount/DAILY_GOAL*100));
  document.getElementById('dailyBar').style.width = pct+"%";
  document.getElementById('dailyText').textContent =
    "오늘 "+Math.min(state.todayCount,DAILY_GOAL)+"/"+DAILY_GOAL+" 단어 학습"+(state.todayCount>=DAILY_GOAL?" ✅ 목표 달성!":"");

  fillDeckSelect(document.getElementById('deckSel'), true);
  const deck = findDeck(state.selectedDeck) || BUILTIN_DECKS[0];
  document.getElementById('deckSel').value = deck.id;
  document.getElementById('deckDesc').textContent = deck.desc;

  const wc = wrongCount();
  document.getElementById('wrongInfo').textContent =
    wc>0 ? "복습할 단어가 "+wc+"개 있어요. 틀린 단어는 맞힐 때까지 여기 모여요." : "아직 틀린 단어가 없어요. 퀴즈에서 틀린 단어가 자동으로 모여요.";
  document.getElementById('wrongBtn').disabled = wc===0;
}

function fillDeckSelect(sel, withProgress){
  const prev = sel.value;
  sel.innerHTML = "";
  getDecks().forEach(d=>{
    const o = document.createElement('option');
    o.value = d.id;
    let done = "";
    if(withProgress){
      const m = d.words.filter(w=>getWordProg(d.id,w.en).box>=5).length;
      done = " ("+m+"/"+d.words.length+")";
    }
    o.textContent = d.name + done;
    sel.appendChild(o);
  });
  if(prev && [...sel.options].some(o=>o.value===prev)) sel.value = prev;
}

/* =====================================================================
   학습 (플래시카드 + 라이트너 간격반복)
   ===================================================================== */
let studyQueue=[], studyIdx=0, studyDeck=null, isFlipped=false;

function startStudy(){
  const selVal = document.getElementById('deckSel').value;
  if(selVal){ state.selectedDeck = selVal; save(); }
  studyDeck = findDeck(state.selectedDeck) || BUILTIN_DECKS[0];
  studyQueue = [...studyDeck.words].sort((a,b)=>
    getWordProg(studyDeck.id,a.en).box - getWordProg(studyDeck.id,b.en).box);
  studyIdx = 0;
  document.getElementById('studyMain').classList.remove('hidden');
  document.getElementById('studyDone').classList.add('hidden');
  go('study');
  showCard();
}

function shuffleStudy(){
  for(let i=studyQueue.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [studyQueue[i],studyQueue[j]]=[studyQueue[j],studyQueue[i]];
  }
  studyIdx=0; showCard(); toast("🔀 섞었어요");
}

function showCard(){
  if(studyIdx>=studyQueue.length){ finishStudy(); return; }
  const w = studyQueue[studyIdx];
  isFlipped=false;
  document.getElementById('flash').classList.remove('flip');
  document.getElementById('fWord').textContent = w.en;
  document.getElementById('fPhon').textContent = w.phon||"";
  document.getElementById('fPos').textContent = w.pos||"";
  document.getElementById('fMean').textContent = w.ko;
  const exEl = document.getElementById('fEx');
  exEl.textContent = "";
  if(w.ex){
    exEl.append("“"+w.ex+"”");
    if(w.exKo){
      exEl.appendChild(document.createElement('br'));
      const sp=document.createElement('span');
      sp.style.cssText="opacity:.75;font-size:13px";
      sp.textContent=w.exKo;
      exEl.appendChild(sp);
    }
  }
  const box = getWordProg(studyDeck.id,w.en).box;
  document.getElementById('studyCount').textContent = (studyIdx+1)+" / "+studyQueue.length+" · "+"⭐".repeat(box);
  document.getElementById('studyBar').style.width = (studyIdx/studyQueue.length*100)+"%";
}

function flipCard(){
  isFlipped=!isFlipped;
  document.getElementById('flash').classList.toggle('flip', isFlipped);
}

function rate(known){
  if(studyIdx>=studyQueue.length) return;
  const w = studyQueue[studyIdx];
  markResult(studyDeck.id, w.en, known);
  studyIdx++;
  showCard();
}

function finishStudy(){
  document.getElementById('studyBar').style.width="100%";
  const mastered = studyDeck.words.filter(w=>getWordProg(studyDeck.id,w.en).box>=5).length;
  document.getElementById('studyMain').classList.add('hidden');
  const d = document.getElementById('studyDone');
  d.classList.remove('hidden');
  document.getElementById('sdDeck').textContent = studyDeck.name;
  document.getElementById('sdScore').textContent = mastered+" / "+studyDeck.words.length;
  toast("🎉 오늘도 수고했어요!");
}

function speakCurrent(){
  const w = studyQueue[studyIdx];
  if(w) speak(w.en);
}
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ toast("이 브라우저는 발음을 지원하지 않아요"); }
}

/* =====================================================================
   퀴즈 (뜻/듣기/스펠링/오답)
   ===================================================================== */
let quizWords=[], quizIdx=0, quizScore=0, quizDeckId=null, quizMode='meaning';

function showQuizMenu(){
  document.getElementById('quizMenu').classList.remove('hidden');
  document.getElementById('quizPlay').classList.add('hidden');
  document.getElementById('quizResult').classList.add('hidden');
  fillDeckSelect(document.getElementById('quizDeckSel'), false);
  document.getElementById('quizDeckSel').value = state.selectedDeck;
}
function currentQuizWord(){ return quizWords[quizIdx]; }

function startQuiz(mode){
  quizMode = mode;
  // 퀴즈 화면으로 이동 (홈의 오답 버튼에서 올 수도 있음)
  document.querySelectorAll('section[id^="view-"]').forEach(s=>s.classList.add('hidden'));
  document.getElementById('view-quiz').classList.remove('hidden');
  document.querySelectorAll('.nav button[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav==='quiz'));

  if(mode==='wrong'){
    const ww = wrongWords();
    save();
    if(ww.length===0){ toast("📕 오답 노트가 비어 있어요!"); showQuizMenu(); return; }
    quizWords = ww.sort(()=>Math.random()-.5).slice(0,10);
    quizDeckId = null; // 단어마다 _deckId 사용
  }else{
    const sel = document.getElementById('quizDeckSel');
    quizDeckId = sel.value || state.selectedDeck;
    state.selectedDeck = quizDeckId; save();
    const deck = findDeck(quizDeckId) || BUILTIN_DECKS[0];
    quizWords = [...deck.words].sort(()=>Math.random()-.5).slice(0, Math.min(8, deck.words.length));
  }
  quizIdx=0; quizScore=0;
  document.getElementById('quizMenu').classList.add('hidden');
  document.getElementById('quizResult').classList.add('hidden');
  document.getElementById('quizPlay').classList.remove('hidden');
  showQuiz();
  window.scrollTo(0,0);
}

function quizWordDeckId(w){ return w._deckId || quizDeckId; }

function showQuiz(){
  if(quizIdx>=quizWords.length){ finishQuiz(); return; }
  const w = currentQuizWord();
  document.getElementById('quizProg').textContent = (quizIdx+1)+" / "+quizWords.length;
  document.getElementById('quizBar').style.width = (quizIdx/quizWords.length*100)+"%";

  const wordEl = document.getElementById('quizWord');
  const spEl = document.getElementById('quizSpeaker');
  const optsEl = document.getElementById('quizOpts');
  const spellEl = document.getElementById('quizSpell');
  wordEl.classList.add('hidden'); spEl.classList.add('hidden');
  optsEl.classList.add('hidden'); spellEl.classList.add('hidden');
  optsEl.innerHTML="";

  const effectiveMode = (quizMode==='wrong') ? 'meaning' : quizMode;

  if(effectiveMode==='meaning'){
    document.getElementById('quizPrompt').textContent = "다음 단어의 뜻은?";
    wordEl.textContent = w.en;
    wordEl.classList.remove('hidden');
    buildOptions(w);
    optsEl.classList.remove('hidden');
  }
  else if(effectiveMode==='listening'){
    document.getElementById('quizPrompt').textContent = "🎧 발음을 듣고 뜻을 고르세요";
    spEl.classList.remove('hidden');
    buildOptions(w);
    optsEl.classList.remove('hidden');
    setTimeout(()=>speak(w.en), 350);
  }
  else if(effectiveMode==='spelling'){
    document.getElementById('quizPrompt').textContent = "다음 뜻의 영어 단어를 쓰세요";
    wordEl.textContent = w.ko;
    wordEl.classList.remove('hidden');
    spellEl.classList.remove('hidden');
    const inp = document.getElementById('spellInput');
    inp.value=""; inp.disabled=false;
    document.getElementById('spellBtn').disabled=false;
    const fb = document.getElementById('spellFb');
    fb.textContent=""; fb.className="spell-feedback";
    setTimeout(()=>inp.focus(), 100);
  }
}

function buildOptions(w){
  const pool = allWords().filter(x=>x.ko!==w.ko);
  const wrong = pool.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.ko);
  const opts = [w.ko, ...wrong].sort(()=>Math.random()-.5);
  const box = document.getElementById('quizOpts');
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className="opt"; b.textContent=opt;
    b.onclick=()=>answer(b, opt===w.ko, w.ko);
    box.appendChild(b);
  });
}

function answer(btn, correct, correctKo){
  const w = currentQuizWord();
  document.querySelectorAll('#quizOpts .opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctKo) b.classList.add('correct');
  });
  if(correct) quizScore++;
  else btn.classList.add('wrong');
  markResult(quizWordDeckId(w), w.en, correct);
  setTimeout(()=>{ quizIdx++; showQuiz(); }, 850);
}

function checkSpell(){
  const w = currentQuizWord();
  const inp = document.getElementById('spellInput');
  const fb = document.getElementById('spellFb');
  const val = inp.value.trim().toLowerCase();
  if(!val) return;
  const correct = val === w.en.toLowerCase();
  inp.disabled=true;
  document.getElementById('spellBtn').disabled=true;
  if(correct){
    fb.textContent="⭕ 정답! "+w.en;
    fb.className="spell-feedback ok";
    quizScore++;
    speak(w.en);
  }else{
    fb.textContent="❌ 정답: "+w.en;
    fb.className="spell-feedback no";
  }
  markResult(quizWordDeckId(w), w.en, correct);
  setTimeout(()=>{ quizIdx++; showQuiz(); }, 1300);
}

function giveUpSpell(){
  const w = currentQuizWord();
  const fb = document.getElementById('spellFb');
  document.getElementById('spellInput').disabled=true;
  document.getElementById('spellBtn').disabled=true;
  fb.textContent="💡 정답: "+w.en;
  fb.className="spell-feedback no";
  speak(w.en);
  markResult(quizWordDeckId(w), w.en, false);
  setTimeout(()=>{ quizIdx++; showQuiz(); }, 1300);
}

function finishQuiz(){
  document.getElementById('quizPlay').classList.add('hidden');
  const r = document.getElementById('quizResult');
  r.classList.remove('hidden');
  const total = quizWords.length;
  const pct = total ? Math.round(quizScore/total*100) : 0;
  document.getElementById('qrScore').textContent = quizScore+"/"+total;
  let emoji, msg;
  if(pct===100){ emoji="🏆"; msg="완벽해요! 대단해요 👏"; }
  else if(pct>=70){ emoji="🎉"; msg="잘했어요! 조금만 더 연습해요."; }
  else if(pct>=40){ emoji="💪"; msg="좋아요, 반복하면 금방 늘어요."; }
  else { emoji="🌱"; msg="괜찮아요! 다시 학습해 봐요."; }
  document.getElementById('qrEmoji').textContent=emoji;
  document.getElementById('qrMsg').textContent=msg;
  window.scrollTo(0,0);
}

/* =====================================================================
   단어 목록 (검색 포함)
   ===================================================================== */
function renderList(){
  const sel = document.getElementById('listDeckSel');
  fillDeckSelect(sel, false);
  if(!findDeck(sel.value)) sel.value = state.selectedDeck;
  const deck = findDeck(sel.value) || BUILTIN_DECKS[0];
  const q = document.getElementById('listSearch').value.trim().toLowerCase();
  const body = document.getElementById('listBody');
  body.innerHTML="";
  const words = deck.words.filter(w=> !q || w.en.toLowerCase().includes(q) || w.ko.includes(q));
  if(words.length===0){
    const d=document.createElement('div');
    d.className="muted"; d.style.cssText="padding:16px 4px;font-size:13px";
    d.textContent="검색 결과가 없어요.";
    body.appendChild(d);
    return;
  }
  words.forEach(w=>{
    const p = getWordProg(deck.id, w.en);
    const isWrong = !!state.wrongSet[wordKey(deck.id,w.en)];
    const row = document.createElement('div');
    row.className="word-item";

    const left = document.createElement('div');
    const en = document.createElement('div'); en.className="en";
    en.textContent = w.en+" ";
    const ph = document.createElement('span');
    ph.className="muted"; ph.style.cssText="font-weight:400;font-size:13px";
    ph.textContent = w.phon||"";
    en.appendChild(ph);
    const ko = document.createElement('div'); ko.className="ko"; ko.textContent=w.ko;
    left.append(en, ko);

    const right = document.createElement('div');
    right.style.cssText="display:flex;align-items:center;gap:8px";
    const sp = document.createElement('button');
    sp.className="icon-btn"; sp.textContent="🔊";
    sp.onclick=()=>speak(w.en);
    const badge = document.createElement('span');
    if(isWrong){ badge.className="badge wrongb"; badge.textContent="오답"; }
    else if(p.box>=5){ badge.className="badge mastered"; badge.textContent="마스터"; }
    else { badge.className="badge"; badge.textContent="⭐"+p.box; }
    right.append(sp, badge);

    row.append(left, right);
    body.appendChild(row);
  });
}

/* =====================================================================
   내 단어장 (추가/수정/삭제)
   ===================================================================== */
let editingIdx = -1;

function saveMyWord(){
  const en = document.getElementById('mwEn').value.trim();
  const ko = document.getElementById('mwKo').value.trim();
  if(!en || !ko){ toast("영어 단어와 뜻은 꼭 입력해 주세요!"); return; }
  const word = {
    en, ko,
    phon: document.getElementById('mwPhon').value.trim(),
    pos: "my word",
    ex: document.getElementById('mwEx').value.trim(),
    exKo: document.getElementById('mwExKo').value.trim()
  };
  const dupIdx = state.customWords.findIndex((w,i)=>w.en.toLowerCase()===en.toLowerCase() && i!==editingIdx);
  if(dupIdx>=0){ toast("이미 저장된 단어예요!"); return; }

  if(editingIdx>=0){
    const old = state.customWords[editingIdx];
    if(old.en !== en){
      // 단어 이름이 바뀌면 진도/오답 키도 이동
      const oldK = wordKey(CUSTOM_ID, old.en), newK = wordKey(CUSTOM_ID, en);
      if(state.progress[oldK]){ state.progress[newK]=state.progress[oldK]; delete state.progress[oldK]; }
      if(state.wrongSet[oldK]){ state.wrongSet[newK]=true; delete state.wrongSet[oldK]; }
    }
    state.customWords[editingIdx] = word;
    toast("✏️ 수정했어요");
  }else{
    state.customWords.push(word);
    toast("⭐ 저장했어요");
  }
  save();
  resetMyForm();
  renderMyWords();
}

function editMyWord(i){
  const w = state.customWords[i];
  editingIdx = i;
  document.getElementById('mwEn').value = w.en;
  document.getElementById('mwKo').value = w.ko;
  document.getElementById('mwPhon').value = w.phon||"";
  document.getElementById('mwEx').value = w.ex||"";
  document.getElementById('mwExKo').value = w.exKo||"";
  document.getElementById('myFormTitle').textContent = "✏️ 단어 수정";
  document.getElementById('mwSaveBtn').textContent = "💾 수정 저장";
  document.getElementById('mwCancelBtn').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteMyWord(i){
  const w = state.customWords[i];
  if(!confirm('"'+w.en+'" 단어를 삭제할까요?')) return;
  const k = wordKey(CUSTOM_ID, w.en);
  delete state.progress[k];
  delete state.wrongSet[k];
  state.customWords.splice(i,1);
  if(editingIdx===i) resetMyForm();
  save();
  renderMyWords();
  toast("🗑️ 삭제했어요");
}

function resetMyForm(){
  editingIdx = -1;
  ['mwEn','mwKo','mwPhon','mwEx','mwExKo'].forEach(id=>document.getElementById(id).value="");
  document.getElementById('myFormTitle').textContent = "⭐ 단어 추가";
  document.getElementById('mwSaveBtn').textContent = "💾 저장";
  document.getElementById('mwCancelBtn').classList.add('hidden');
}

function renderMyWords(){
  const body = document.getElementById('myBody');
  const empty = document.getElementById('myEmpty');
  document.getElementById('myCount').textContent = "("+state.customWords.length+"개)";
  body.innerHTML="";
  empty.classList.toggle('hidden', state.customWords.length>0);
  state.customWords.forEach((w,i)=>{
    const row = document.createElement('div');
    row.className="word-item";
    const left = document.createElement('div');
    const en = document.createElement('div'); en.className="en"; en.textContent=w.en;
    const ko = document.createElement('div'); ko.className="ko"; ko.textContent=w.ko;
    left.append(en, ko);
    const right = document.createElement('div');
    right.style.cssText="display:flex;align-items:center;gap:2px";
    const sp = document.createElement('button'); sp.className="icon-btn"; sp.textContent="🔊"; sp.onclick=()=>speak(w.en);
    const ed = document.createElement('button'); ed.className="icon-btn"; ed.textContent="✏️"; ed.onclick=()=>editMyWord(i);
    const del = document.createElement('button'); del.className="icon-btn"; del.textContent="🗑️"; del.onclick=()=>deleteMyWord(i);
    right.append(sp, ed, del);
    row.append(left, right);
    body.appendChild(row);
  });
}

/* =====================================================================
   백업 / 복원
   ===================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "my-english-backup-"+todayStr()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("⬇️ 백업 파일을 저장했어요");
}

function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const s = JSON.parse(e.target.result);
      if(typeof s !== 'object' || !s || !('progress' in s)) throw new Error("bad");
      if(!confirm("백업을 불러오면 현재 기록을 덮어써요. 계속할까요?")) return;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
      state = load();
      renderHome();
      toast("⬆️ 백업을 불러왔어요!");
    }catch(err){
      toast("❌ 올바른 백업 파일이 아니에요");
    }
    input.value="";
  };
  reader.readAsText(file);
}

/* =====================================================================
   토스트 & 초기화
   ===================================================================== */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

function init(){
  checkStreak();
  document.getElementById('deckSel').onchange = e=>{
    state.selectedDeck=e.target.value; save();
    document.getElementById('deckDesc').textContent = (findDeck(e.target.value)||{}).desc||"";
  };
  renderHome();
}
init();
</script>
